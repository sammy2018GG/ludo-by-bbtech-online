<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LUDO BY BBTECH</title>
<meta name="description" content="Roll the Dice. Make Your Move. Become a Champion.">
<style>
:root{--ink:#060b1f;--line:rgba(160,185,255,.16);--txt:#f0f4ff;--muted:#9db0e0;--gold:#fbbf24}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--txt);min-height:100vh;display:flex;flex-direction:column;
background:radial-gradient(900px 500px at 15% -10%,#22409a 0%,transparent 60%),radial-gradient(800px 500px at 110% 10%,#0e5a3a66 0%,transparent 60%),var(--ink)}
.hidden{display:none!important}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px clamp(14px,4vw,40px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;background:#060b1fee}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{font-size:18px;letter-spacing:.14em;font-weight:900}
.brand p{font-size:10px;letter-spacing:.24em;color:var(--gold);font-weight:700}
main{flex:1;width:min(1400px,100%);margin:0 auto;padding:clamp(14px,4vw,32px) clamp(14px,4vw,32px) 170px}
footer{border-top:1px solid var(--line);padding:16px;color:var(--muted);font-size:13px;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
footer b{color:var(--txt)}
button{font:inherit;font-weight:700;color:#fff;border:0;border-radius:14px;padding:12px 20px;min-height:46px;cursor:pointer;background:linear-gradient(135deg,#2563eb,#1e3a8a);box-shadow:0 10px 28px rgba(37,99,235,.35);transition:transform .15s,opacity .2s}
button:hover:not(:disabled){transform:translateY(-2px)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
button.alt{background:transparent;border:1px solid var(--line);box-shadow:none}
button.go{background:linear-gradient(135deg,#22c55e,#15803d);box-shadow:0 10px 28px rgba(34,197,94,.35)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{background:#16286a;box-shadow:none;opacity:.85;min-width:96px}
.seg button[aria-pressed="true"]{background:linear-gradient(135deg,var(--gold),#d97706);color:#1b1200;opacity:1}
.card{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.label{font-weight:700;color:var(--muted);font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
.hint{color:var(--muted);font-size:14px;margin-top:6px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.hero{display:grid;gap:28px;align-items:center}
@media(min-width:860px){.hero{grid-template-columns:1fr 1fr}}
.hero h2{font-size:clamp(34px,6vw,58px);line-height:1.02;font-weight:900;letter-spacing:-.02em}
.hero h2 span{background:linear-gradient(90deg,var(--gold),#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{color:var(--muted);margin:14px 0 24px;font-size:17px;line-height:1.5}
.tok.clickable{cursor:pointer}
.tok .ring{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.game{display:grid;gap:18px;align-items:start}
@media(min-width:900px){.game{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}}
.side{display:grid;gap:14px}
.status{font-size:20px;font-weight:800}
.pl{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.03);transition:border-color .3s,box-shadow .3s}
.pl.active{border-color:var(--gold);box-shadow:0 0 0 3px rgba(251,191,36,.2)}
.pl small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.rank{margin-left:auto;background:var(--gold);color:#1b1200;font-weight:900;border-radius:10px;padding:4px 9px}
.dice-area{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:16px}
.dice{width:88px;height:88px;border-radius:20px;background:linear-gradient(145deg,#ffffff,#dfe7ff);box-shadow:inset 0 -6px 0 #b8c6ee,0 14px 30px rgba(0,0,0,.4);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:14px;gap:4px}
.dice.shake{animation:shake .6s ease}
@keyframes shake{0%{transform:rotate(0)}15%{transform:rotate(-16deg) translateY(-6px)}30%{transform:rotate(14deg)}45%{transform:rotate(-10deg) translateY(-3px)}60%{transform:rotate(8deg)}80%{transform:rotate(-3deg)}100%{transform:rotate(0)}}
.dice-pair{display:flex;gap:14px}
.dice{cursor:pointer;transition:opacity .2s}
.dice.sel{outline:3px solid var(--gold);outline-offset:4px}
.dice.spent{opacity:.35}
.pip{border-radius:50%}
.pip.on{background:#0d1a44}
ul.log{list-style:none;display:grid;gap:6px;font-size:14px;color:#cdd8f5;max-height:230px;overflow:auto}
ul.log li{padding:8px
